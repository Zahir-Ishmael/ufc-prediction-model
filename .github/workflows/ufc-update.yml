
name: Update UFC data and rebuild model

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'
      timezone: 'America/New_York'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      
      - name: Update UFC fight data
        env:
          FIGHTERAPI_KEY: ${{ secrets.FIGHTERAPI_KEY }}
        run: python update_ufc_data.py


      - name: Rebuild fighter features
        run: python build_features.py

      - name: Retrain prediction model
        run: python train_model.py

      - name: Save updated data and model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update UFC data and model" && git push)
